<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- CPS SSO: usable only through the CPS Digital Platform portal -->
<script src="/cps-portal/sso-gate.js" data-app="ie-digital-program" data-token></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102b46">
<title>CPS IE Studio</title>
<meta name="description" content="วิเคราะห์งาน IE · Time Study และ Before/After · เก็บข้อมูลบน Google Sheet">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=202611290900">
</head>
<body>

<!-- ======== GATE: เลือกพื้นที่ก่อนใช้งาน ======== -->
<!-- ======== LOGIN: รหัสเข้าใช้งานของทีม ======== -->
<section id="login" class="gate" hidden>
  <div class="gate-card">
    <h1>CPS IE Studio</h1>
    <p class="gate-sub">ใส่รหัสเข้าใช้งานของทีม (ขอจากผู้ดูแลระบบ)</p>
    <form id="login-form" class="login-form">
      <input id="login-code" type="password" autocomplete="current-password" placeholder="รหัสเข้าใช้งาน" required>
      <button id="login-go" class="primary" type="submit">เข้าสู่ระบบ →</button>
    </form>
    <p id="login-msg" class="muted" role="status"></p>
  </div>
</section>

<section id="gate" class="gate">
  <div class="gate-card">
    <h1>CPS IE Studio</h1>
    <p class="gate-sub" id="gate-sub">เลือกระดับการใช้งาน แล้วเลือกพื้นที่</p>

    <ol class="steps">
      <li class="step" data-step="level">
        <div class="step-head"><span class="step-no">1</span><b>ระดับการใช้งาน</b></div>
        <div class="step-body">
          <select id="sel-level">
            <option value="">— เลือก —</option>
            <option value="team">🧑‍🔧 ระดับทีม — บันทึก/ทำงาน เห็นเฉพาะทีมตัวเอง</option>
            <option value="group">👥 ระดับกลุ่ม — วิเคราะห์รวมทุกทีมในกลุ่ม</option>
            <option value="workshop">🏢 ระดับ Workshop — วิเคราะห์รวมทั้ง Workshop</option>
            <option value="factory">🏭 ระบบโรงงาน — วิเคราะห์รวมทุกพื้นที่</option>
          </select>
        </div>
      </li>
      <li class="step" data-step="workshop">
        <div class="step-head"><span class="step-no">2</span><b>Workshop</b></div>
        <div class="step-body">
          <select id="sel-workshop"></select>
          <div class="step-add" hidden>
            <input id="new-workshop" placeholder="ชื่อ Workshop ใหม่" autocomplete="off">
            <button type="button" class="mini" data-addconfirm="workshop">เพิ่ม</button>
            <button type="button" class="mini ghost" data-addcancel="workshop">ยกเลิก</button>
          </div>
        </div>
      </li>
      <li class="step" data-step="group">
        <div class="step-head"><span class="step-no">3</span><b>กลุ่ม (Group)</b></div>
        <div class="step-body">
          <select id="sel-group" disabled></select>
          <div class="step-add" hidden>
            <input id="new-group" placeholder="ชื่อ Group ใหม่" autocomplete="off">
            <button type="button" class="mini" data-addconfirm="group">เพิ่ม</button>
            <button type="button" class="mini ghost" data-addcancel="group">ยกเลิก</button>
          </div>
        </div>
      </li>
      <li class="step" data-step="team">
        <div class="step-head"><span class="step-no">4</span><b>ทีม (Team)</b></div>
        <div class="step-body">
          <select id="sel-team" disabled></select>
          <div class="step-add" hidden>
            <input id="new-team" placeholder="ชื่อ Team ใหม่" autocomplete="off">
            <button type="button" class="mini" data-addconfirm="team">เพิ่ม</button>
            <button type="button" class="mini ghost" data-addcancel="team">ยกเลิก</button>
          </div>
        </div>
      </li>
    </ol>

    <button id="enter" class="primary" disabled>เข้าใช้งาน →</button>
    <button id="gate-cancel" type="button" class="ghost" hidden>← กลับ (ไม่เปลี่ยนพื้นที่)</button>
    <p id="gate-msg" class="muted" role="status"></p>
    <button id="gate-logout" type="button" class="linklike" hidden>ออกจากระบบ</button>
  </div>
</section>

<!-- ======== APP ======== -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="mark">▟</span><div>CPS IE Studio<small id="scope-crumb"></small></div></div>
    <div class="top-actions">
      <span id="sync-badge" class="badge" title="สถานะการซิงค์">●</span>
      <label class="lang-global"><span class="vh">ภาษา / Language</span><select id="lang-global" aria-label="ภาษา / Language"></select></label>
      <button id="btn-help" class="ghost help-btn" type="button" aria-label="วิธีใช้" title="วิธีใช้">?</button>
      <button id="btn-switch" class="ghost">เปลี่ยนพื้นที่</button>
      <button id="btn-logout" class="ghost" hidden>ออกจากระบบ</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button data-tab="dashboard" class="active" role="tab" aria-selected="true">แดชบอร์ด</button>
    <button data-tab="timestudy" role="tab" aria-selected="false">Time Study</button>
    <button data-tab="stations" role="tab" aria-selected="false">สมดุลสถานี</button>
    <button data-tab="analysis" role="tab" aria-selected="false">วิเคราะห์งาน</button>
  </nav>

  <main>
    <section id="tab-dashboard" class="tab-page"></section>
    <section id="tab-timestudy" class="tab-page" hidden></section>
    <section id="tab-stations" class="tab-page" hidden></section>
    <section id="tab-analysis" class="tab-page" hidden></section>
  </main>

  <footer>CPS IE Studio · <span id="foot-label">ข้อมูลพื้นที่:</span> <span id="foot-scope"></span></footer>
</div>

<div id="toast" role="status"></div>

<script src="app.js?v=202611290900"></script>
<script src="timestudy.js?v=202611290900"></script>
<script src="stationbalance.js?v=202611290900"></script>
<script src="workflow.js?v=202611290900"></script>
<script src="dash-i18n.js?v=202611290900"></script>
<script src="ui-i18n.js?v=202611290900"></script>
<script src="ppt-report.js?v=202611290900"></script>
<script src="dashboard.js?v=202611290900"></script>
<script src="analysis.js?v=202611290900"></script>
<script>window.CPS && window.CPS.boot();</script>
</body>
</html>
